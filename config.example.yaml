# ===== 模型（密钥请放 .env，不要写这里）=====
# 照 AIHOT 的能力分层：摘要/判权用便宜档，对话用主档
llm:
  chat:
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    temperature: 0.2
    max_tokens: 16384
    timeout_s: 60
    # 深度思考：true=原质量；false=请求体带 thinking:{"type":"disabled"}，
    # 实测 completion 162→36（−78%），但工具选择质量要自己验（设置栏里也能改）
    thinking: true
  summary:
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    temperature: 0.1
    max_tokens: 4096
    timeout_s: 60
    thinking: true

# ===== 对话循环 =====
runtime:
  max_tool_calls_per_turn: 12     # 防死循环；超限 stop_reason="tool_limit"
  # 多会话并行上限（docs/20 §5.1，默认 3）：每个会话占一个线程，
  # 这个数 = **同时真在干活的会话数**。第 N+1 个 chat.send 直接回 at_capacity
  # （不排队）；`chat.status.capacity.max` 如实回这个数。
  max_parallel_sessions: 3
  max_context_chars: 60000        # 超过则压缩历史
  stream: true
  allow_clarify: true             # 允许模型每轮最多反问一次（决议 3）
  # 开局把目标拆成子问题（A1）。开着每**会话**多一次小调用，换来的是第 2 轮之后
  # "缺口清单"有具体粒度（"第 3 条子问题还没证据"），而不是只能换词重搜。
  # 关掉仍然有缺口清单，只是粒度粗（按年份/来源族/摘要缺失判断）。
  plan_by_model: true
  # 子 Agent P0（docs/16 §3.3）：并行抓取来源的并发上限。
  # 只并行出网（各来源同时检索），绝不并发调模型；限速仍由出网层按 host 串行化。
  max_parallel_fetches: 3
  # 子 Agent P1（docs/16 §3.3）：顺序子任务（ReWOO 式"先规划后执行"）。**默认关** ——
  # 每个子任务是一次隔离的 mini-loop（独立 messages + 小预算），只把最终文本并回主 loop；
  # 开着一定会多花模型调用。整批成本由总额度池兜住（默认且上限 = max_tool_calls_per_turn 的 1/2）。
  # 记账 usage_records.purpose="subtask"，可在 session.usage 里看到这笔开销。
  # 开启后模型可见工具 research.delegate（docs/01 §5.18）才可用：它把互不依赖的子问题交给子任务，
  # 子任务**实际消耗的工具调用数从本轮主循环的剩余预算里扣**（同一本账）；关着时该工具回 ok=false。
  subtask_enabled: false
  # 飞书渠道（docs/17 §3.8）：入站走 **websocket 长连接**（官方 SDK `lark-oapi`），本机主动外连，
  # **不需要公网地址 / 回调 URL / 隧道**，所以没有任何监听开关/端口/路径配置键
  # （历史上那三枚 feishu_listener_* 随 webhook 路线一起删了；启动入口见 scripts/feishu_ws_up.py）。
  # 飞书**出站发送器**（把一轮回答推回飞书，docs/17 §3.7）：**默认关**。
  # 关着时渠道层只记录、绝不发任何外网；开启需同时配好 .env 的 FEISHU_APP_ID / FEISHU_APP_SECRET。
  feishu_reply_enabled: false
  # 飞书**入站即时回执**文案（docs/17 §3.11）：收到消息、白名单放行后**先回这一条**，再跑轮次
  # （一轮 3–12 分钟，用户不该等这么久才知道"收到了"）。空串 = 关掉回执。
  # 回执与回答**共用同一个出站开关**（feishu_reply_enabled=false 时一次外网都不发），
  # 并且按 message_id 去重（飞书重推同一事件不会让用户收到双份）。
  feishu_ack_text: "已接受消息，正在处理中"

  # ---- 第 7 步：跑完提醒（docs/20 §6.3 第 (2) 条）**默认关** ----
  # 语义：一轮 `chat.done` 且**该会话不是界面当前显示的会话** → 飞书**私聊**推一条摘要
  # （标题 + 首行 200 字 + stop_reason / 耗时）。
  # 关着时 `runtime/notify.py` 第一步就回 disabled：不查库、不出网、连收件人都不解析
  #（"关着时一次外网都不发"是可断言的事实）。
  # 硬约束：**只私聊、不发群**（`receive_id_type=open_id`，目标是唯一已配对用户；
  # 群主动消息需群主授权，项目口径就是不发）；同一 turn_id 只提醒一次 + 60s 限频；
  # 发送失败只记日志，绝不影响轮次结论。
  # 收件人取 `feishu_paired_users` 里**唯一**的那个用户；0 个或多个 → 一条都不发（不猜）。
  notify_turn_done: false
  # 提醒平台：目前只实现 `feishu`（本项目没有 QQ 通道）。写别的名字**一律不发**并记 warning
  # —— 不假装支持。
  notify_turn_done_platform: "feishu"

  # ---- 第 8 步：每日用量封顶（docs/20 §5.1/§5.2）**默认无上限** ----
  # 口径：**滚动 24 小时**（不是自然日，避免午夜"回血"的悬崖），按 `usage_records` 汇总。
  # 超限行为：① 正在跑的这一轮在**下一次模型调用前**收口（只再给一次无工具总结，
  # `stop_reason="budget"`，已生成正文不丢）；② 新的轮次直接拒绝（`daily_budget_exceeded`）。
  # 当前用量在 `chat.status` 的 `global_budget` 键里（未配置时 enabled=false、各项为 null）。
  # null / 不写 = 不限制；`0` 与负数**也按"不限制"**归一（写 0 的直觉是"先关掉"）。
  daily_token_budget: null
  # 金额上限：**只在配了单价（`est_cost` 非空）时才生效**；单价未配时不算金额、这条上限不生效
  #（绝不按估算单价折出一个好看的数字）。null = 不限制。
  daily_cost_budget: null
  # ---- 会话级工具调用上限（docs/20 §5.1）**默认无上限** ----
  # 一个会话**累计**能调多少次工具（跨轮累计，取自 tool_traces 的行数 —— 落库口径，
  # 重启进程后仍然准；子任务内部的调用也按主会话记账，所以同样计入）。
  # 超限行为：① 正在跑的这一轮在**下一次工具调用前**停手，只再给一次无工具总结，
  # `stop_reason="session_tool_limit"`（已生成正文不丢）；② 该会话后续的新轮次直接拒绝
  # （`session_tool_limit_exceeded`），提示用户新开会话 —— 这条闸**不随时间回血**。
  # 当前用量在 `chat.status` 的 `session_tool_budget` 键里（未配置时 enabled=false）。
  # null / 不写 = 不限制；`0` 与空串**也按"不限制"**（与 daily_token_budget 共用合法值判断）。
  # **写错就报错**：`true`/`false`（bool）、负数、`'abc'` 这类非数字串会在启动时 ValueError，
  # 错误里带 `runtime.max_tool_calls_per_session` —— 不静默变成"无上限"（一个 typo 关掉安全阀）。
  max_tool_calls_per_session: null

  # ---- 日志落盘（`src/scholarscout/logging_setup.py`）----
  # 写 `run/logs/scout.log`（目录自动建，UTF-8）。打包版双击启动没有终端，
  # 这份文件就是唯一的故障现场：出事时把 `run/logs/` 整个拷走发过来。
  # **严格校验**：级别名写错、大小/份数写成 0 或负数 → 启动时直接报错（不静默回默认）。
  log_level: "INFO"               # CRITICAL / ERROR / WARNING / INFO / DEBUG / NOTSET
  log_max_mb: 5                   # 单文件上限（MB，可写小数：0.5 = 512KB）
  log_backups: 3                  # 历史份数：scout.log.1 ~ scout.log.3
  # 密钥绝不入盘：`logging_setup.RedactingFilter` 两道 —— 已配置的真实值（.env 里的
  # LLM_API_KEY / FEISHU_APP_SECRET / FEISHU_VERIFY_TOKEN 等）逐个替换成 [REDACTED]，
  # 再兜一道 `sk-[A-Za-z0-9_-]{10,}` 正则。所以**往日志里打 key 也不会泄露**，
  # 但这不是"可以随便打密钥"的许可：能不打就不打。

# ===== 摘要流水线（照 AIHOT 的"截断 + 一次调用"，见 docs/04）=====
summary:
  prompts_dir: "prompts"
  truncate_chars: 6000            # 送模型前正文截断阈值（AIHOT 实测用的就是 6000）
  max_text_chars: 60000           # 本地全文硬上限，超出记 documents.truncated=1
  summary_min_chars: 80
  summary_max_chars: 160
  max_sentences: 3
  guard_check_numbers: true       # 数字可溯源守卫（摘要里的数字必须在正文里找得到）
  max_points: 4

# ===== 检索来源（学术 / 通用 / 商用，三层）=====
search:
  # 默认来源：auto = 只带"现在真能用的"来源
  #   arxiv + openalex（都免 key）+ 已配实例的 searxng + 已配 key 的商用来源
  #   （tavily/serper/brave/google_cse/semantic_scholar）
  #   抓取类来源（bing/duckduckgo）不进 auto：一个 robots 禁、一个需梯子，带上就每次撞墙
  providers: ["auto"]
  default_limit: 10
  per_provider_limit: 8
  # 通用搜索（免 key、推荐）：自建 SearxNG 实例，见 deploy/searxng/
  #   cd deploy/searxng && docker compose up -d  →  然后填 http://localhost:8080
  searxng_base_url: ""
  # Google 可编程搜索的搜索引擎 ID（不是密钥；key 放 .env 的 GOOGLE_CSE_KEY）
  #   在 https://programmablesearchengine.google.com/ 创建，每天 100 次免费额度
  google_cse_cx: ""
  # OpenAlex 的"礼貌池"联系邮箱（不是密钥）。填了官方给更好的服务与稳定性
  openalex_mailto: ""
  # 是否允许抓搜索结果页（默认 false —— Bing 的 robots.txt 明确 Disable /search）
  #   打开即把 bing/duckduckgo 主机加进 robots 豁免名单，这是你的选择，不是默认行为
  allow_searchpage_scraping: false
  min_interval_s:                 # 限速：每个 provider 的最小请求间隔
    arxiv: 3.0                    # 踩过的坑：arXiv 连续请求会被 406 限速
    openalex: 0.5                 # 官方建议 ≤10 次/秒，留余量
    semantic_scholar: 1.5
    bing: 1.0
    duckduckgo: 1.5
    searxng: 1.0
    tavily: 0.5
    serper: 0.5
    brave: 1.0
    google_cse: 0.5
    # 注意：**故意不写 github** —— 它的间隔取决于有没有配 token（未认证 6s / 认证 2s），
    # 由 providers/github.py 自己算；写进这张表会覆盖它 → 打光额度、间歇 403
    # （同样的道理：任何"动态算间隔"的来源都不要写在这里）

# ===== 抓取 =====
fetch:
  timeout_s: 20
  # ---- 分阶段超时：建连 / robots 探针 / 整次抓取各给各的预算 ----
  # 为什么不再"一个 timeout_s 管所有阶段"：旧实现所有阶段共用 20s 又被 retries=3 叠乘，
  # 再叠上「落地页 → http:// 回落」那条不可达的路径（同一 URL 的 https 只要 1.4s），
  # 真机 trace 里**单次 source.fetch 是 486s**，一轮 6 次 = 836s。默认值全表见 fetch/http.py 顶部。
  connect_timeout_s: 5.0          # 建连（唯一会卡"不可达主机"的一段 → 给短值）
  # 整次抓取的墙钟预算。null/不写 = 由出网层按 timeout_s × 1.5 算（不在两处各写一份常数）
  deadline_s: null
  robots_timeout_s: 5.0           # robots 探针只是副作用检查，不该拖住正式抓取
  retries: 3
  user_agent: "ScholarScout/0.1 (academic research assistant; contact: <you@example.com>)"
  max_bytes: 20000000             # 单文件下载上限 20MB（出网层硬上限：超出直接拒收）
  # 抽取阈值（MB，可为小数）：文件超过它**不抽正文**，只登记大小/类型/源地址，
  # extract_status="skipped_large"（音视频另标 skipped_media）。
  # 与上面 max_bytes 的分工：max_bytes 是出网层红线（超了连字节都拿不到），
  # large_file_mb 是落盘后"要不要抽正文"的阈值。docs/19 §8.3
  large_file_mb: 20
  # 抽取阶段（本地 pymupdf 逐页）的墙钟预算：超了就如实标 extract_status="extract_timeout" ——
  # 宁可这一条没摘要，也不让一轮对话卡在本地解析上（实测 arXiv 800KB/54k 字符 PDF 只要 0.07–0.2s）
  extract_timeout_s: 60.0
  # MinerU 轮询阶段的**单次**预算（原为写死的 180s，且"直传 + URL 提交"两次调用 → 最坏 360s）
  mineru_poll_timeout_s: 90.0
  respect_robots: true

# ===== 扫描版 / 复杂版式 PDF：MinerU 官方接口（决议 8，见 docs/04 §7）=====
mineru:
  enabled: true
  token_env: "MINERU_API_TOKEN"   # 免登录轻量接口不需要；精准接口需要
  prefer_agent_api: true          # 优先走免登录轻量接口
  agent_max_bytes: 10000000       # 轻量接口限制：10MB
  agent_max_pages: 20             # 轻量接口限制：20 页
  precise_max_bytes: 200000000    # 精准接口限制：200MB
  precise_max_pages: 200          # 精准接口限制：200 页
  poll_interval_s: 5              # 异步：提交 → 轮询
  poll_timeout_s: 600
  daily_page_quota: 1000          # 官方每账号每天最高优先级额度，超出只降优先级

# ===== 检索层（决议 6：trigram + 短查询 LIKE 兜底）=====
search_index:
  tokenizer: "trigram"
  fts_min_query_chars: 3          # 短于 3 字自动走 LIKE（实测：2 字 trigram 命不中）

# ===== 路径 =====
paths:
  data_dir: "data"
  db_path: "run/state.db"

# ===== 资料落地布局（docs/19 §2）=====
library:
  # **目录如何切分**，从外到内。默认 session/format =
  #   data/raw/<会话>/<格式>/<标题>--<sha8>.<ext>   原件（全文同目录同名，只差 .txt 后缀）
  #   data/library/<会话>/<格式>/index.md            该桶清单（全库清单另有 data/library/index.md）
  # 可用段：
  #   session   = 会话标题 slug（两个会话同名时追加 --<短会话 id> 区分）
  #   format    = 格式，取自 sources.source_type（paper/doc/video/code/其他→other）
  #   collected = 收录年月（documents.fetched_at，"我什么时候采到它"）
  #   published = 发表年月（arXiv 号或 meta 日期，"它自己什么时候出的"）
  #   type      = format 的旧称（等价）
  # **未知段直接报错**（不静默写错位置）。改这里就换了全库布局，paths / source.fetch /
  # 迁移脚本都从它读；改完跑一次 `python scripts/migrate_raw_names.py` 把老文件迁过去。
  layout: "session/format"

# ===== 装配开关（论文消融用）=====
features:
  enable_mineru: true
  enable_topic_map: true
  enable_route_plan: true
  # 按需下载（archive.download，docs/01 §3.3）：**默认关**。关着时界面「下载」按钮
  # 不动网，只回 {ok:false, reason}；开启后才真下载到 data/raw/（受 fetch.max_bytes 硬上限）。
  enable_download: false
  # 本地知识库检索（kb.search，docs/01 §5.8）：**默认关 —— 开了才有 kb.search**。
  # 关着时这个工具不注册（模型清单里没有它）；开启后第一次检索才建索引
  # （data/cache/kb-fts.sqlite3：正文只进这份可删可重建的缓存，资料库 run/state.db 里没有）。
  enable_kb: false

# ===== 生成策略 =====
generation:
  # 产物（知识地图 / 学习路线 / 抽背卡）是否每轮自动生成。
  # false = 先问用户（默认）：由用户主动选择时才生成 —— 省 token，也把选择权还给用户。
  auto_artifacts: false
  # 跨会话记忆的**按轮触发**（nudge，照 Hermes 的 nudge_interval，docs/16 §2 P1-1）。
  #   0（默认）= 关：仍是"每会话最多一次"，成本口径与引入前完全一致；
  #   >0 = 距上次抽取的用户轮数 ≥ 该值就再抽一次（续写式）。
  # 开启后约每 n 轮多一次小调用（purpose="memory" 已记账，session.usage 里能看到）。
  memory_nudge_turns: 0

# ===== 界面 =====
ui:
  # 无边框窗口（自绘标题栏）。默认 false = 系统原生窗框，Windows 上最稳。
  frameless_window: false
  # 主窗口几何：宽/高/x/y/是否最大化。null = 用默认尺寸（1440×900，最小 1280×800，
  # 大屏按可用区域收窄、小屏夹回屏内）。启动时读、关窗时写；几何没变不重写文件。
  # 想回到默认：设置 → 外观与关于 → 「恢复默认窗口大小」（清空本键，下次启动生效）。
  window: null

