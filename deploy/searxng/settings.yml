# SearxNG 最小配置（国内网络可用版）
#
# 三个必须处理的地方，缺一个都跑不通 —— 全部是 2026-10-05 在本机实测出来的：
#
#  1) **开启 JSON 输出**：默认只给 html，我们走 format=json，不开则接口恒 400/403
#  2) **只留可达引擎**：默认引擎表里 google / duckduckgo / brave / wikipedia / wikidata
#     在境内全部 timeout → 结果是 results: [] 加一串 unresponsive_engines
#  3) **镜像要用国内源**：registry-1.docker.io 在本机不可达（拉不动镜像），
#     改用 docker.m.daocloud.io 拉取后重新打标即可（见 docker-compose.yml 顶部注释）
#
# 逐引擎实测（2026-10-05 本机）：
#   360search -> 5-6 条 ✅   sogou -> 10-11 条 ✅
#   bing      -> **看查询，也看聚合**：强制单查（engines=bing）时正常查询有 16 条真结果，
#                但混在默认引擎集里跑时贡献 0 条 —— 聚合下为何不出结果未查清（SearxNG 内部
#                有引擎挂起机制，且不体现在 unresponsive_engines 里）。
#                成本为零（不报错、不拖慢），先留着；要清理随时删这一行。
#                教训：**别拿一次查询、更别拿单个引擎的裸查结果去判断它在聚合里的表现**。
#   mwmbl     -> 4 条但**时好时坏**（复测 timeout，会拖慢整次查询）→ 不留
#   baidu     -> CAPTCHA ✗   quark -> crash ✗   chinaso -> 0 条 ✗   mojeek -> 0 条 ✗
#              （baidu 在**真浏览器**会话下一样被安全验证拦，不是"缺个浏览器"的问题）
#
# 注意：容器刚 restart 完别立刻查，SearxNG 加载引擎要十几秒，
# 太早查会得到 results: [] 且 unresponsive_engines 为空（看着像"引擎全挂"，其实还没就绪）。
use_default_settings:
  engines:
    keep_only:
      - 360search
      - sogou
      - bing

# keep_only 只是"从默认表里保留"，**不等于启用**：这些引擎在默认 settings.yml 里
# 本来就是 disabled（SearxNG 把不常用的引擎默认关着）。结果就是 /config 报
# "启用引擎数: 0"，聚合查询恒 0 条 —— 而在查询里显式写 engines=360search 又会强制运行，
# 于是出现"单引擎有结果、聚合没结果"的怪象。必须显式打开：
engines:
  - name: 360search
    disabled: false
  - name: sogou
    disabled: false
  - name: bing
    disabled: false

server:
  secret_key: "scholarscout-local-only-change-me"
  limiter: false # 本地自用：关掉防滥用限流，否则同一秒多次查询会被拒

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

ui:
  static_use_hash: true
