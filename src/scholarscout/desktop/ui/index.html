<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ScholarScout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>ScholarScout</strong>
      <span class="sub">开放世界学术调研与学习辅助</span>
    </div>
    <div class="status" id="status">正在连接后端…</div>
    <div class="actions">
      <button id="btn-theme" class="ghost" type="button" title="切换浅色/深色">跟随系统</button>
      <button id="btn-settings" class="ghost" type="button" title="设置（模型、外观、生成策略、数据）">设置</button>
      <button id="btn-new" type="button">新建会话</button>
      <button id="btn-refresh" type="button">刷新</button>
    </div>
  </header>

  <main class="layout">
    <aside class="col col-sessions">
      <h2>会话</h2>
      <ul class="list" id="session-list"></ul>
    </aside>

    <div class="splitter" id="split-left" role="separator" aria-orientation="vertical"
         title="拖动调整宽度（双击复位）"></div>

    <section class="col col-chat">
      <div class="messages" id="messages">
        <p class="empty">问点什么，例如：「帮我找教育智能体方向的入门资料，判一下权威性，再排一条 4 周学习路线」</p>
      </div>
      <form class="composer" id="composer">
        <textarea id="input" rows="3" placeholder="Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-actions">
          <span class="hint" id="hint">工具调用与出处都会显示在这里</span>
          <button id="btn-send" type="submit">发送</button>
        </div>
      </form>
    </section>

    <div class="splitter" id="split-right" role="separator" aria-orientation="vertical"
         title="拖动调整宽度（双击复位）"></div>

    <section class="col col-right">
      <nav class="tabs">
        <button class="tab is-active" type="button" data-tab="sources">资料库</button>
        <button class="tab" type="button" data-tab="routes">学习路线</button>
        <button class="tab" type="button" data-tab="notes">笔记</button>
        <button class="tab" type="button" data-tab="cards">抽背卡</button>
      </nav>

      <div class="pane is-active" id="pane-sources">
        <div class="row">
          <input id="search" placeholder="搜摘要：≥3 字走 FTS，2 字自动走 LIKE 兜底">
          <button id="btn-search" type="button">搜索</button>
        </div>
        <ul class="list" id="source-list"></ul>
        <div class="detail" id="source-detail"></div>
      </div>

      <div class="pane" id="pane-routes">
        <p class="hint">本会话生成的路线；点开看每周目标与检查点。</p>
        <div class="row">
          <button id="btn-history" class="ghost" type="button">显示全部历史产物</button>
        </div>
        <ul class="list" id="route-list"></ul>
        <div class="detail" id="route-detail"></div>
      </div>

      <div class="pane" id="pane-notes">
        <p class="hint">学习笔记与资料摘要；点开直接在应用内读，也能定位到本地 Markdown。</p>
        <div class="row">
          <button class="ghost" type="button" id="btn-note-kind-note">学习笔记</button>
          <button class="ghost" type="button" id="btn-note-kind-summary">资料摘要</button>
        </div>
        <ul class="list" id="note-list"></ul>
        <div class="detail" id="note-detail"></div>
      </div>

      <div class="pane" id="pane-cards">
        <p class="hint">抽背卡：正面问、背面答；可定位到本地 Markdown。</p>
        <ul class="list" id="card-list"></ul>
        <div class="detail" id="card-detail"></div>
      </div>
    </section>
  </main>

  <div id="settings" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <strong>设置</strong>
        <span class="hint" id="settings-note"></span>
        <button id="btn-settings-close" class="ghost" type="button">关闭</button>
      </div>
      <div class="sheet-body" id="settings-body"></div>
      <div class="sheet-foot">
        <span class="hint" id="settings-path"></span>
        <button id="btn-settings-save" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="textmodal" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <strong id="textmodal-title">导出</strong>
        <span class="hint" id="textmodal-note"></span>
        <button id="btn-textmodal-copy" type="button">复制</button>
        <button id="btn-textmodal-close" class="ghost" type="button">关闭</button>
      </div>
      <div class="sheet-body">
        <textarea id="textmodal-body" readonly spellcheck="false"></textarea>
      </div>
      <div class="sheet-foot">
        <span class="hint" id="textmodal-path"></span>
      </div>
    </div>
  </div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
