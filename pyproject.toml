[project]
name = "scholarscout"
version = "0.0.1"
description = "开放世界学术调研与学习辅助智能体（本科毕业设计）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "PyYAML>=6.0.2,<7",
    "pywebview>=5.3,<6",
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
# 扫描版/复杂版式走 MinerU 官方 HTTP API，不是本地依赖，见 docs/04 §7
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]
#: 只在你**要出交付包**时才需要（`scripts/build_bundle.py`）；运行期完全不依赖，
#: 所以不进 project.dependencies（审批记录见 deps-allowlist.txt 与 docs/03 §6）
build = [
    "pyinstaller>=6.10,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarscout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",      # 行宽交给 formatter
    "RUF001",    # 全宽标点误报：本项目注释/文案是中文，全宽括号引号是正常写法
    "RUF002",    # 同上（docstring）
    "RUF003",    # 同上（注释）
]

[tool.mypy]
python_version = "3.11"
files = ["src", "eval"]
mypy_path = "src"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# 目标：逐步收紧到 strict = true（W2 起）
strict = false

# PyYAML 不带类型标注；不引第三方 stub 包（依赖要审批），直接放过该模块
[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
