[project]
name = "scholarscout"
version = "0.1.0"
description = "开放世界学术调研与学习辅助智能体（本科毕业设计）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "PyYAML>=6.0.2,<7",
    "pywebview>=5.3,<6",
    "pymupdf>=1.24,<2",
    # 飞书入站：官方 SDK 的 websocket 长连接（本机主动外连，不需要公网地址/回调/隧道）。
    # 审批：用户 2026-10-14 拍板"飞书改走 A"；登记在 deps-allowlist.txt 与 docs/03 §6。
    "lark-oapi>=1.7,<2",
    # docx/xlsx 目标编辑：给 `py.exec` 的"读并改用户文档"能力兜底（改完存回原格式，
    # 而不是转成纯文本）。纯 stdlib 只能读 OOXML 的 zip+XML，写回会破坏样式与公式。
    # 审批：**用户 2026-10-22 批准**；登记在 deps-allowlist.txt 与 docs/03 §6。
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# 扫描版/复杂版式走 MinerU 官方 HTTP API，不是本地依赖，见 docs/04 §7
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]
#: 只在你**要出交付包**时才需要（`scripts/build_bundle.py`）；运行期完全不依赖，
#: 所以不进 project.dependencies（审批记录见 deps-allowlist.txt 与 docs/03 §6）
build = [
    "pyinstaller>=6.10,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarscout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D100", "D104"]
ignore = [
    "E501",      # 行宽交给 formatter
    "RUF001",    # 全宽标点误报：本项目注释/文案是中文，全宽括号引号是正常写法
    "RUF002",    # 同上（docstring）
    "RUF003",    # 同上（注释）
]
# 关于 D100 / D104（模块与包必须有 docstring）：
#   这是"这个文件是干什么的"唯一不会腐烂的位置 —— 与代码同文件、同一个提交、被 pdoc/编辑器直接读，
#   所以它由 lint 强制，而不是靠另写一份说明文档。
#   为什么开两条：`__init__.py` 归 D104（包），其余模块归 D100 —— 只开 D100 会漏掉所有包的入口。
#   **只开这两条，不要开整个 D 族**：D2xx/D4xx 是 docstring 的**格式**规则（摘要后空行、首行句号结尾…），
#   与中文 docstring 的全宽标点打架，而 RUF001-003 已经 ignore 了全宽标点，再引格式规则只会制造噪音。
#   **已知盲区**：`_` 开头的模块被 ruff 当私有，D100 不管（本项目 linted 范围内只有 tests/desktop/_ui.py 一个）。
#   开这两条时实测：src/tests/scripts/eval 共 273 个 py 文件（其中 28 个是 __init__.py），缺 docstring 的 0 个 —— 零新增报错。

[tool.mypy]
python_version = "3.11"
files = ["src", "eval"]
mypy_path = "src"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# 目标：逐步收紧到 strict = true（W2 起）
strict = false

# PyYAML 不带类型标注；不引第三方 stub 包（依赖要审批），直接放过该模块
[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
